insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat
insmod udf

if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    set gfxmode="auto"
    terminal_output console
fi

set default=koros
set timeout=5
set timeout_style=menu

if [ "${grub_platform}" == 'efi' ]; then
    set archiso_platform="UEFI"
elif [ "${grub_platform}" == 'pc' ]; then
    set archiso_platform="BIOS"
else
    set archiso_platform="${grub_cpu}-${grub_platform}"
fi

menuentry "KorOS Live (%ARCH%, ${archiso_platform})" --class gnu-linux --class gnu --class os --id koros {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "KorOS Live (Accessibility)" --class gnu-linux --id koros-accessibility {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry "UEFI Firmware Settings" --id uefi-firmware {
        fwsetup
    }
fi

menuentry "Restart" --class restart {
    reboot
}

menuentry "Shutdown" --class shutdown {
    halt
}
